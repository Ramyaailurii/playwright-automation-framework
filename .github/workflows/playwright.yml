name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Create auth state
        run: python3 create_auth_state.py

      - name: Run tests
        run: pytest

      - name: Upload new snapshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: snapshots/